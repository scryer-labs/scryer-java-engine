name: "CI"
on:
  push:
    branches:
      - "main"
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: "read"
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  build:
    name: "Test, build and package"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    steps:
      - uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803"
      - uses: "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16"
        with:
          go-version-file: "go.mod"
          cache: false
      - uses: "actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961"
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: "gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2"
      - name: "Test Go wrapper (race)"
        run: "go test -race ./..."
      - name: "Vet Go wrapper"
        run: "go vet ./..."
      - name: "Clean JVM build"
        run: "./gradlew --no-daemon --console=plain clean"
      - name: "Test Java facts and JSON"
        run: "./gradlew --no-daemon --console=plain test"
      - name: "Build wrapper and JVM worker"
        run: "./scripts/build"
      - name: "Package engine and bundled Java 21"
        run: |-
          ./scripts/package
          ./scripts/package --with-runtime
      - name: "Verify engine packages and isolated bundled runtime"
        run: "./scripts/verify-packages"
      - name: "Upload packages"
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "scryer-java-engine-package-${{ github.sha }}"
          path: |-
            build/distributions/*.zip
            build/distributions/*.tar.gz
            build/distributions/SHA256SUMS
          if-no-files-found: "error"
          retention-days: 14
          compression-level: 0
